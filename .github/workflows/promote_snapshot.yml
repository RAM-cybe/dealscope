name: Promote snapshot

# The only job that turns a reviewed quarterly snapshot into production data.
# Never scheduled. Never auto-merges. After this runs, a human still merges
# the two PRs it opens (backend live pointer, then frontend data / Vercel).

on:
  workflow_dispatch:
    inputs:
      snapshot_path:
        description: >-
          Path to the reviewed snapshot on this repo, e.g.
          data/snapshots/dealscope_2026-10-01.csv
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas==2.2.2

      - name: Promote snapshot locally
        env:
          SNAPSHOT_PATH: ${{ github.event.inputs.snapshot_path }}
        run: python promote_snapshot.py "$SNAPSHOT_PATH"

      - name: Open backend promotion PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "Promote ${{ github.event.inputs.snapshot_path }} to live dataset"
          title: "Promote snapshot to live (${{ github.run_id }})"
          body: >-
            Promotes `${{ github.event.inputs.snapshot_path }}` to the live
            dataset: copies it under `data/enriched/`, repoints
            `data/live.json`, and regenerates frontend JSON including
            `dataset-meta.json` dates. Live market caps that are newer than
            the snapshot are kept. **Does not auto-merge.** Merge this PR,
            then the matching frontend PR, to publish.
          branch: "promote/${{ github.run_id }}"
          add-paths: |
            data/enriched/*
            data/live.json
            data/frontend/*
          draft: false

      - name: Require frontend git credentials
        env:
          DEALSCOPE_APP_ID: ${{ vars.DEALSCOPE_APP_ID }}
          DEALSCOPE_APP_PRIVATE_KEY: ${{ secrets.DEALSCOPE_APP_PRIVATE_KEY }}
          FRONTEND_DEPLOY_KEY: ${{ secrets.FRONTEND_DEPLOY_KEY }}
        run: bash .github/scripts/require_frontend_credentials.sh

      - name: Mint short-lived GitHub App token
        if: ${{ vars.DEALSCOPE_APP_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.DEALSCOPE_APP_ID }}
          private-key: ${{ secrets.DEALSCOPE_APP_PRIVATE_KEY }}
          owner: RAM-cybe
          repositories: dealscope-frontend

      - name: Checkout dealscope-frontend (GitHub App)
        if: ${{ vars.DEALSCOPE_APP_ID != '' }}
        uses: actions/checkout@v4
        with:
          repository: RAM-cybe/dealscope-frontend
          path: dealscope-frontend
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Checkout dealscope-frontend (deploy key)
        if: ${{ vars.DEALSCOPE_APP_ID == '' }}
        uses: actions/checkout@v4
        with:
          repository: RAM-cybe/dealscope-frontend
          path: dealscope-frontend
          ssh-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
          persist-credentials: true

      - name: Push frontend promotion branch (never main, never auto-merge)
        id: frontend_push
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          bash .github/scripts/push_frontend_branch.sh \
            dealscope-frontend \
            "promote/${{ github.run_id }}" \
            "Promote snapshot: sync from dealscope backend (${{ github.run_id }})"

      - name: Wait until frontend apply-data-bot opens the promotion PR
        if: steps.frontend_push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait_for_frontend_pr.sh "promote/${{ github.run_id }}" OPEN

      - name: Healthcheck success
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_QUARTERLY_URL }}
          HEALTHCHECK_KIND: promote
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py success

      - name: Healthcheck failure
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_QUARTERLY_URL }}
          HEALTHCHECK_KIND: promote
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py failure
