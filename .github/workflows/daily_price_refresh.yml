name: Daily price refresh

# Market cap is the only figure that genuinely moves day to day. Fundamentals
# (revenue, EBITDA, margins, ROCE, debt) only change when a company reports —
# that is quarterly_refresh.yml, which never auto-publishes.
#
# Circuit breaker: if too many previously-capped tickers fail, the Python
# job exits without writing. Last good data stays in git and on the site.

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily, after NSE close
  workflow_dispatch:
    inputs:
      limit:
        description: >-
          Test-only: limit the pull to the first N companies (e.g. 20) for a
          fast smoke-test run. Leave blank for a real full run.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas==2.2.2 yfinance

      - name: Run daily price refresh
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python refresh_daily_prices.py "$LIMIT"

      - name: Regenerate frontend data from this refresh
        run: python export_for_frontend.py

      - name: Sync fresh data to dealscope-frontend (direct push, no PR)
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${FRONTEND_REPO_TOKEN}@github.com/RAM-cybe/dealscope-frontend.git" \
            /tmp/dealscope-frontend
          cp deal-scope-interface/data/companies.json /tmp/dealscope-frontend/data/companies.json
          cp deal-scope-interface/data/deals.json /tmp/dealscope-frontend/data/deals.json
          cp deal-scope-interface/data/filter-bands.json /tmp/dealscope-frontend/data/filter-bands.json
          cp deal-scope-interface/data/sector-bands.json /tmp/dealscope-frontend/data/sector-bands.json
          cp deal-scope-interface/data/dataset-meta.json /tmp/dealscope-frontend/data/dataset-meta.json
          cd /tmp/dealscope-frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/companies.json data/deals.json data/filter-bands.json data/sector-bands.json data/dataset-meta.json; then
            echo "No change vs dealscope-frontend's current data -- nothing to push."
            exit 0
          fi
          git add data/companies.json data/deals.json data/filter-bands.json data/sector-bands.json data/dataset-meta.json
          git commit -m "Daily price refresh: sync from dealscope backend (${{ github.run_id }})"
          git push origin main

      - name: Open pull request with updated market caps
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Daily price refresh (${{ github.run_id }})"
          title: "Daily price refresh (${{ github.run_id }})"
          body: >-
            Automated daily market cap / price refresh. Fundamentals
            (revenue, EBITDA, ROCE, debt, etc.) are unchanged -- those only
            update via the quarterly refresh. Safe to auto-merge.
          branch: "price-refresh/${{ github.run_id }}"
          add-paths: |
            data/enriched/*
            deal-scope-interface/data/*
          draft: false

      - name: Auto-merge (low risk, price data only)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="price-refresh/${{ github.run_id }}"
          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr merge --auto --squash "$BRANCH"
          else
            echo "No price-refresh PR opened (no data change) — nothing to merge."
          fi

      - name: Healthcheck success
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
          HEALTHCHECK_KIND: daily
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py success

      - name: Healthcheck failure
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
          HEALTHCHECK_KIND: daily
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py failure
