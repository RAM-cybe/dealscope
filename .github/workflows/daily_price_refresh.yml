name: Daily price refresh

# Market cap is the only figure that genuinely moves day to day. Fundamentals
# (revenue, EBITDA, margins, ROCE, debt) only change when a company reports —
# that is quarterly_refresh.yml, which never auto-publishes.
#
# Circuit breaker: if too many previously-capped tickers fail, the Python
# job exits without writing. Last good data stays in git and on the site.
#
# Frontend publish: push a price-sync/* branch with a short-lived GitHub App
# token or a repo-scoped SSH deploy key (never a PAT, never a token in a
# clone URL). dealscope-frontend's apply-data-bot workflow opens a PR and
# squash-merges it. This job waits for that merge so a green run means the
# site actually got the data.

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily, after NSE close
  workflow_dispatch:
    inputs:
      limit:
        description: >-
          Test-only: limit the pull to the first N companies (e.g. 20) for a
          fast smoke-test run. Leave blank for a real full run.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: daily-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas==2.2.2 yfinance

      - name: Run daily price refresh
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python refresh_daily_prices.py "$LIMIT"

      - name: Regenerate frontend data from this refresh
        run: python export_for_frontend.py

      - name: Require frontend git credentials
        env:
          DEALSCOPE_APP_ID: ${{ vars.DEALSCOPE_APP_ID }}
          DEALSCOPE_APP_PRIVATE_KEY: ${{ secrets.DEALSCOPE_APP_PRIVATE_KEY }}
          FRONTEND_DEPLOY_KEY: ${{ secrets.FRONTEND_DEPLOY_KEY }}
        run: bash .github/scripts/require_frontend_credentials.sh

      - name: Mint short-lived GitHub App token
        if: ${{ vars.DEALSCOPE_APP_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.DEALSCOPE_APP_ID }}
          private-key: ${{ secrets.DEALSCOPE_APP_PRIVATE_KEY }}
          owner: RAM-cybe
          repositories: dealscope-frontend

      - name: Checkout dealscope-frontend (GitHub App)
        if: ${{ vars.DEALSCOPE_APP_ID != '' }}
        uses: actions/checkout@v4
        with:
          repository: RAM-cybe/dealscope-frontend
          path: dealscope-frontend
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Checkout dealscope-frontend (deploy key)
        if: ${{ vars.DEALSCOPE_APP_ID == '' }}
        uses: actions/checkout@v4
        with:
          repository: RAM-cybe/dealscope-frontend
          path: dealscope-frontend
          ssh-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
          persist-credentials: true

      - name: Push price-sync branch (never main, never force)
        id: frontend_push
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          bash .github/scripts/push_frontend_branch.sh \
            dealscope-frontend \
            "price-sync/${{ github.run_id }}" \
            "Daily price refresh: sync from dealscope backend (${{ github.run_id }})"

      - name: Wait until frontend apply-data-bot merges the price-sync PR
        if: steps.frontend_push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait_for_frontend_pr.sh "price-sync/${{ github.run_id }}" MERGED

      - name: Open pull request with updated market caps
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "Daily price refresh (${{ github.run_id }})"
          title: "Daily price refresh (${{ github.run_id }})"
          body: >-
            Automated daily market cap / price refresh. Fundamentals
            (revenue, EBITDA, ROCE, debt, etc.) are unchanged -- those only
            update via the quarterly refresh. Safe to auto-merge.
          branch: "price-refresh/${{ github.run_id }}"
          add-paths: |
            data/enriched/*
            deal-scope-interface/data/*
          draft: false

      - name: Auto-merge (low risk, price data only)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/merge_pr_retry.sh "${{ steps.cpr.outputs.pull-request-number }}"

      - name: Healthcheck success
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
          HEALTHCHECK_KIND: daily
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py success

      - name: Healthcheck failure
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
          HEALTHCHECK_KIND: daily
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py failure
