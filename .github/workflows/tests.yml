name: Tests

# Scoring, refresh guards, and live-pointer checks. No data is published.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pandas==2.2.2

      - name: Scoring
        run: python3 tests/test_scoring.py

      - name: Refresh guards
        run: python3 tests/test_refresh_guards.py
