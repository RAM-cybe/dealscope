name: Quarterly data refresh

# Real fundamentals pull — revenue, EBITDA, margins, ROCE, debt — on the
# first of January, April, July and October. Writes a dated snapshot and
# opens a REVIEW PR. Merging that PR does not go live. After review, run
# the "Promote snapshot" workflow.

on:
  schedule:
    - cron: '0 3 1 1,4,7,10 *'  # 03:00 UTC, 1st of Jan / Apr / Jul / Oct
  workflow_dispatch:
    inputs:
      limit:
        description: >-
          Test-only: limit the pull to the first N companies (e.g. 20) for a
          fast smoke-test run. Leave blank for a real full run — never set
          this for a scheduled/production refresh.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas==2.2.2 pyarrow yfinance

      - name: Resolve current live dataset path
        id: resolve
        run: |
          echo "path=$(python -c "
          import sys; sys.path.insert(0, '.')
          from src.data.loaders import DEFAULT_COMPANIES_PATH
          print(DEFAULT_COMPANIES_PATH)
          ")" >> "$GITHUB_OUTPUT"

      - name: Run fundamentals pull
        env:
          DEALSCOPE_INPUT_FILE: ${{ steps.resolve.outputs.path }}
          DEALSCOPE_OUTPUT_DIR: data/snapshots
          DEALSCOPE_LIMIT: ${{ github.event.inputs.limit }}
        run: python refresh_quarterly_fundamentals.py

      - name: Identify the snapshot file just written
        id: snapshot
        run: |
          FILE=$(ls -t data/snapshots/dealscope_*.csv | head -1)
          echo "Found: $FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run automated data-quality checker against the new snapshot
        id: quality
        run: python .github/scripts/check_snapshot_quality.py "${{ steps.snapshot.outputs.path }}"

      - name: Write promotion instructions into the PR body
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "## This PR does not go live"
            echo ""
            echo "Merging this PR only stores the candidate snapshot and the quality report."
            echo "It does **not** change \`DEFAULT_COMPANIES_PATH\`, does **not** update"
            echo "the frontend, and does **not** change the dates on the live site."
            echo ""
            echo "### After you have reviewed the snapshot"
            echo ""
            echo "1. Merge this PR (so the snapshot is on \`main\`)."
            echo "2. Run **Actions → Promote snapshot → Run workflow**."
            echo "3. Set \`snapshot_path\` to \`${{ steps.snapshot.outputs.path }}\`."
            echo "4. That workflow opens two further PRs (backend live pointer + frontend data)."
            echo "5. Merge those only if the numbers look right. That is what Vercel deploys."
            echo ""
            echo "A limited/smoke-test run must not be promoted."
          } >> .github/scripts/pr_body_fragment.md

      - name: Open review pull request (snapshot only, never auto-merge)
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Quarterly snapshot: ${{ steps.snapshot.outputs.path }}"
          title: >-
            Quarterly snapshot for review (${{ github.run_id }})${{ steps.quality.outputs.needs_review == 'true' && ' -- NEEDS MANUAL REVIEW' || '' }}
          body-path: .github/scripts/pr_body_fragment.md
          branch: "data-refresh/${{ github.run_id }}"
          add-paths: |
            data/snapshots/*
            data/quality_reports/*
          draft: false

      - name: Healthcheck success
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_QUARTERLY_URL }}
          HEALTHCHECK_KIND: quarterly
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py success

      - name: Healthcheck failure
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_QUARTERLY_URL }}
          HEALTHCHECK_KIND: quarterly
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/healthcheck_ping.py failure
